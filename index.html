<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beast Battler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="screen-overlay" class="screen-overlay hidden">
      <div id="overlay-content" class="overlay-content">
        <h1 id="overlay-title">Title</h1>
        <p id="overlay-text">Text</p>
        <button id="btn-restart" class="btn primary hidden">Restart Run</button>
      </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    
    <div class="app-container">
      <header class="top-bar">
        <h1>Beast Battler</h1>
        <div class="stats">
          <div class="stat">Level: <span id="level-display">1</span></div>
          <div class="stat">Shop Lvl: <span id="shop-level-display">1</span></div>
          <div class="stat gold">Gold: <span id="gold-display">100</span></div>
        </div>
      </header>

      <main class="game-area">
        <div class="panel lineup-panel">
          <h2>Your Inventory</h2>
          <div id="beast-slots" class="slots">
            <!-- Beast items injected here -->
          </div>
        </div>

        <div class="panel fight-panel">
          <h2>Combat Arena</h2>
          <div class="boss-stats">
            <div class="boss-hp">Boss HP: <span id="boss-hp-display">100</span> / <span id="boss-hp-max">100</span></div>
            <div class="boss-hp-bar-container">
              <div id="boss-hp-bar" class="boss-hp-bar"></div>
            </div>
          </div>
          <div id="fight-arena" class="fight-arena">
            <div id="arena-left" class="arena-side"></div>
            <div id="arena-vs" class="arena-vs">VS</div>
            <div id="arena-right" class="arena-side">
              <div id="arena-boss" class="boss-icon" title="Boss">👹</div>
            </div>
          </div>
          <div id="combat-log" class="combat-log">
            <!-- Combat text injected here -->
          </div>
        </div>

        <div class="panel compute-panel">
          <h2>Genetic Algorithm Optimizer</h2>
          <div class="ga-controls">
            <button id="btn-run-epochs" class="btn primary">Start training</button>
            <div class="compute-stats">
              <div>Epochs Available: <span id="epochs-display">0</span></div>
              <div>Best Expected Dmg: <span id="best-dmg-display">0</span></div>
            </div>
          </div>
          <div class="ga-visuals">
            <div id="best-sequence-container" class="best-sequence-container">
              <h3>Best Sequence Found</h3>
              <div class="sequence-and-graph">
                <div id="best-sequence-display" class="best-sequence-display">
                  <div class="sequence-slot empty">1</div>
                  <div class="sequence-slot empty">2</div>
                  <div class="sequence-slot empty">3</div>
                  <div class="sequence-slot empty">4</div>
                  <div class="sequence-slot empty">5</div>
                </div>
                <div class="graph-scroll-container">
                  <canvas id="bump-chart" width="550" height="400"></canvas>
                </div>
              </div>
            <div id="matrix-view" class="matrix-view">
              <!-- Animated sequence visualizer -->
            </div>
          </div>
          <button id="btn-fight" class="btn danger full-width">LOCK IN & FIGHT</button>
        </div>
      </main>

      <footer class="shop-area panel">
        <h2>The Shop</h2>
        <div class="shop-container">
          <div id="shop-items" class="shop-items">
            <!-- Shop items injected here -->
          </div>
          <div id="shop-actions" class="shop-actions">
            <!-- Action buttons injected here -->
          </div>
        </div>
      </footer>
    </div>
    
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
